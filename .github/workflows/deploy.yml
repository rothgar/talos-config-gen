name: Deploy

on:
  push:
    branches:
      - main
      - claude/talos-config-generator-BufNL
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#
#   CF_API_TOKEN        Cloudflare API token — Scope: Account / Workers Scripts:Edit
#   CF_ACCOUNT_ID       Cloudflare Account ID  ← must also be added as a Variable (see below)
#   ANTHROPIC_API_KEY   Your Anthropic API key
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#
#   CF_ACCOUNT_ID       Cloudflare Account ID — GitHub Actions cannot read secrets in
#                       job-level `if` conditions, so this value must be set here too.
#                       The actual deploy uses the secret if both are present.
#
# Optional GitHub Variables:
#
#   PAGES_ORIGIN        Your GitHub Pages URL e.g. https://your-user.github.io
#                       Used to restrict the worker's CORS allowed origin.
#                       If omitted the worker accepts requests from any origin.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # 1. Deploy the Cloudflare Worker (proxy) and capture its public URL
  # ---------------------------------------------------------------------------
  deploy-worker:
    runs-on: ubuntu-latest
    # GitHub Actions does not allow `secrets` context in job-level `if` conditions,
    # so CF_ACCOUNT_ID must be set as a Variable to trigger this job.
    # The deploy step below still falls back to the secret value if available.
    if: ${{ vars.CF_ACCOUNT_ID != '' }}
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          # Push secrets into the worker
          echo "${{ secrets.ANTHROPIC_API_KEY }}" \
            | npx wrangler secret put ANTHROPIC_API_KEY

          if [ -n "${{ vars.PAGES_ORIGIN }}" ]; then
            echo "${{ vars.PAGES_ORIGIN }}" \
              | npx wrangler secret put ALLOWED_ORIGIN
          fi

          # Deploy the worker
          npx wrangler deploy

          # Derive the workers.dev URL via the CF API — far more reliable than
          # parsing wrangler's console output
          subdomain=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['subdomain'])")

          echo "worker_url=https://talos-ai-proxy.${subdomain}.workers.dev" \
            >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build the static site, injecting the worker URL if available
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    # Run even if deploy-worker was skipped (no CF credentials)
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Use the URL output by the worker deploy job, falling back to a
          # manually-configured variable if the worker job was skipped.
          VITE_AI_PROXY_URL: ${{ needs.deploy-worker.outputs.worker_url || vars.VITE_AI_PROXY_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # 3. Publish to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Explicit condition breaks GitHub's chain-skipping behaviour: without this,
    # deploy is silently skipped whenever deploy-worker is skipped or fails —
    # even though deploy only directly depends on build.
    if: ${{ always() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
