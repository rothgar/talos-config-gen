name: Deploy

on:
  push:
    branches:
      - main
      - claude/talos-config-generator-BufNL
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#
#   CF_API_TOKEN        Cloudflare API token — Scope: Account / Workers Scripts:Edit
#   CF_ACCOUNT_ID       Cloudflare Account ID (can be a Secret or a Variable)
#   ANTHROPIC_API_KEY   Your Anthropic API key
#
# Optional GitHub Variables:
#
#   CF_ACCOUNT_ID       Also accepted as a repository or environment Variable
#   PAGES_ORIGIN        Your GitHub Pages URL e.g. https://your-user.github.io
#                       Used to restrict the worker's CORS allowed origin.
#                       If omitted the worker accepts requests from any origin.
#   VITE_AI_PROXY_URL   Override the worker URL (skips auto-detection)
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # 1. Deploy the Cloudflare Worker (proxy) and capture its public URL.
  #    Always runs — credential check happens inside so that environment-scoped
  #    variables and secrets are both accessible (job-level `if` only sees
  #    repository-level vars, not environment-scoped ones or secrets).
  # ---------------------------------------------------------------------------
  deploy-worker:
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: check
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_ACCOUNT_ID or CF_API_TOKEN not set — skipping worker deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install Worker dependencies
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        id: deploy
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          # Push secrets into the worker
          echo "${{ secrets.ANTHROPIC_API_KEY }}" \
            | npx wrangler secret put ANTHROPIC_API_KEY

          if [ -n "${{ vars.PAGES_ORIGIN }}" ]; then
            echo "${{ vars.PAGES_ORIGIN }}" \
              | npx wrangler secret put ALLOWED_ORIGIN
          fi

          # Deploy the worker
          npx wrangler deploy

          # Derive the workers.dev URL via the CF API — far more reliable than
          # parsing wrangler's console output
          subdomain=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['subdomain'])")

          echo "worker_url=https://talos-ai-proxy.${subdomain}.workers.dev" \
            >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build the static site, injecting the worker URL if available
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    # Run even if deploy-worker was skipped (no CF credentials)
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Use the URL output by the worker deploy job, falling back to a
          # manually-configured variable if the worker job was skipped.
          VITE_AI_PROXY_URL: ${{ needs.deploy-worker.outputs.worker_url || vars.VITE_AI_PROXY_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # 3. Publish to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Explicit condition breaks GitHub's chain-skipping behaviour: without this,
    # deploy is silently skipped whenever deploy-worker is skipped or fails —
    # even though deploy only directly depends on build.
    if: ${{ always() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
