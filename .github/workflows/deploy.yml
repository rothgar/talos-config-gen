name: Deploy

on:
  push:
    branches:
      - main
      - claude/talos-config-generator-BufNL
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   CF_API_TOKEN        Cloudflare API token — Scope: Account / Workers Scripts:Edit
#   ANTHROPIC_API_KEY   Your Anthropic API key
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#
#   CF_ACCOUNT_ID       Cloudflare Account ID (Dashboard → right sidebar)
#
# Optional GitHub Variables:
#
#   PAGES_ORIGIN        Your GitHub Pages URL e.g. https://your-user.github.io
#                       Used to restrict the worker's CORS allowed origin.
#                       If omitted the worker accepts requests from any origin.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # 1. Deploy the Cloudflare Worker (proxy) and capture its public URL
  # ---------------------------------------------------------------------------
  deploy-worker:
    runs-on: ubuntu-latest
    # Skip this job when CF credentials are not configured so the workflow
    # still works for contributors / forks that only want the static site.
    if: ${{ vars.CF_ACCOUNT_ID != '' }}
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          # Set the Anthropic key as a secret inside the worker
          echo "${{ secrets.ANTHROPIC_API_KEY }}" \
            | npx wrangler secret put ANTHROPIC_API_KEY --force

          # Optionally lock CORS to the Pages origin
          if [ -n "${{ vars.PAGES_ORIGIN }}" ]; then
            npx wrangler secret put ALLOWED_ORIGIN --force <<< "${{ vars.PAGES_ORIGIN }}"
          fi

          # Deploy and capture the published URL from wrangler output
          deploy_output=$(npx wrangler deploy 2>&1)
          echo "$deploy_output"
          worker_url=$(echo "$deploy_output" \
            | grep -oE 'https://[a-z0-9._-]+\.workers\.dev' \
            | head -1)
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build the static site, injecting the worker URL if available
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    # Run even if deploy-worker was skipped (no CF credentials)
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Use the URL output by the worker deploy job, falling back to a
          # manually-configured variable if the worker job was skipped.
          VITE_AI_PROXY_URL: ${{ needs.deploy-worker.outputs.worker_url || vars.VITE_AI_PROXY_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # 3. Publish to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
